apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must have an explicit tag."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: block-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "The latest tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
