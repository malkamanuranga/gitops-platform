apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-readiness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "A readiness probe is required."
        pattern:
          spec:
            containers:
              - readinessProbe:
                  periodSeconds: ">0"
