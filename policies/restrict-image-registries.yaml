apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: trusted-registries-only
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must come from a trusted registry."
        pattern:
          spec:
            containers:
              - image: "nginxinc/* | ghcr.io/malkamanuranga/*"
